<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quét Trực Tiếp CCCD - An Sinh Xã Hội</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background: #0f172a; color: #fff; font-family: sans-serif; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
  </style>
</head>
<body class="p-3">
  <div class="container" style="max-width: 450px;">
    <h5 class="text-center text-info fw-bold mb-3">🎁 ĐIỂM DANH TRAO QUÀ CCCD</h5>
    
    <div class="card bg-dark border-secondary p-3 mb-3">
      <div class="mb-2">
        <label class="small text-secondary mb-1">Đợt quà:</label>
        <select id="campaignSelect" class="form-select form-select-sm bg-secondary text-white border-0">
          <option value="">Đang tải danh sách...</option>
        </select>
      </div>
      <div>
        <label class="small text-secondary mb-1">Thiết bị quét:</label>
        <input type="text" id="officerName" class="form-control form-control-sm bg-secondary text-white border-0" value="Điện thoại 1">
      </div>
    </div>

    <!-- Khung Live Camera -->
    <div id="reader" class="mb-3"></div>

    <div class="d-grid gap-2 mb-3">
      <button id="btnCam" class="btn btn-primary fw-bold py-2" onclick="startScanner()">
        📹 BẬT CAMERA QUÉT TRỰC TIẾP
      </button>
    </div>

    <!-- Kết quả -->
    <div id="resBox" style="display: none;" class="card p-3 text-center border-0 mb-3">
      <div id="resTitle" class="fw-bold fs-5 mb-1"></div>
      <div id="resContent" class="small mb-3"></div>
      <button class="btn btn-light btn-sm fw-bold" onclick="resetScan()">Quét tiếp ⏩</button>
    </div>
  </div>

  <script>
    // DÁN LINK GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY:
    const API_URL = "https://script.google.com/macros/s/AKfycbyWQHXubH4wjJZhCV3pFBK10Vhoje17EvsvCsV1s45vF0abZUvgaXXWN1XsVRn5Tz3d/exec";

    let html5QrCode = null;
    let isProcessing = false;

    window.onload = () => {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          const sel = document.getElementById("campaignSelect");
          sel.innerHTML = "";
          data.campaigns.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c.id;
            opt.textContent = c.id + " - " + c.name;
            sel.appendChild(opt);
          });
        });
    };

    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: { width: 250, height: 250 } },
        onScanSuccess
      ).then(() => {
        document.getElementById("btnCam").style.display = "none";
      }).catch(err => alert("Lỗi camera: " + err));
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const campaignId = document.getElementById("campaignSelect").value;
      const officer = document.getElementById("officerName").value;

      if (!campaignId) {
        alert("Chưa chọn đợt quà!");
        isProcessing = false;
        return;
      }

      showWait();

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ qrRaw: decodedText, campaignId: campaignId, officer: officer })
      })
      .then(res => res.json())
      .then(showResult)
      .catch(err => {
        alert("Lỗi kết nối: " + err);
        isProcessing = false;
      });
    }

    function showWait() {
      const b = document.getElementById("resBox");
      b.style.display = "block";
      b.className = "card p-3 text-center border-0 bg-secondary text-white mb-3";
      document.getElementById("resTitle").textContent = "⏳ Đang đối soát...";
      document.getElementById("resContent").textContent = "Đang kiểm tra dữ liệu...";
    }

    function showResult(res) {
      const b = document.getElementById("resBox");
      b.style.display = "block";

      if (res.status === 'SUCCESS') {
        b.className = "card p-3 text-center border-0 bg-success text-white mb-3";
        document.getElementById("resTitle").textContent = "✅ HỢP LỆ - ĐÃ NHẬN";
        document.getElementById("resContent").innerHTML = `${res.resident.hoTen}<br>CCCD: ${res.resident.soCCCD} (${res.resident.khuPho})`;
      } else if (res.status === 'ALREADY_CLAIMED') {
        b.className = "card p-3 text-center border-0 bg-danger text-white mb-3";
        document.getElementById("resTitle").textContent = "⚠️ ĐÃ NHẬN QUÀ RỒI";
        document.getElementById("resContent").innerHTML = `${res.message}<br>${res.resident.hoTen} - ${res.resident.khuPho}`;
      } else {
        b.className = "card p-3 text-center border-0 bg-warning text-dark mb-3";
        document.getElementById("resTitle").textContent = "❌ NGOÀI DANH SÁCH";
        document.getElementById("resContent").textContent = res.message;
      }
    }

    function resetScan() {
      document.getElementById("resBox").style.display = "none";
      isProcessing = false;
    }
  </script>
</body>
</html>
