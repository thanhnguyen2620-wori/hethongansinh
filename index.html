<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quét Thẻ CCCD Điểm Danh Nhận Quà</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Thư viện quét mã vạch & QR chuẩn công nghiệp -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      background-color: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    .top-header {
      background: #1e293b;
      padding: 12px 16px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }
    /* Khung chuẩn tỷ lệ vật lý CCCD: 85.6mm x 53.98mm ~ 1.5858 : 1 */
    .cccd-frame-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      aspect-ratio: 1.5858 / 1;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #3b82f6;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
    }
    #reader {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }
    #reader video {
      object-fit: cover !important;
      width: 100% !important;
      height: 100% !important;
    }
    /* Khung ngắm mô phỏng viền thẻ CCCD */
    .card-border-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 92%;
      height: 90%;
      border: 2px dashed rgba(56, 189, 248, 0.9);
      border-radius: 10px;
      pointer-events: none;
      box-shadow: 0 0 0 5000px rgba(0, 0, 0, 0.45);
      z-index: 4;
    }
    /* Góc định vị mã QR ở phía trên bên phải của thẻ */
    .qr-target-box {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 68px;
      height: 68px;
      border: 2px solid #fbbf24;
      border-radius: 8px;
      background: rgba(251, 191, 36, 0.2);
    }
    .qr-target-box::after {
      content: "MÃ QR";
      position: absolute;
      bottom: -18px;
      right: 0;
      font-size: 10px;
      font-weight: 800;
      color: #fbbf24;
    }
    .btn-action {
      font-size: 16px;
      font-weight: bold;
      padding: 14px;
      border-radius: 12px;
    }
    /* Vùng trạng thái phản hồi lớn */
    .status-card {
      border-radius: 14px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="fw-bold text-info fs-5">🎁 ĐIỂM DANH TRAO QUÀ CCCD</div>
    <small class="text-secondary">Khung tỷ lệ chuẩn 1.586 : 1 | Full HD 1080p</small>
  </div>

  <div class="container py-2" style="max-width: 480px;">
    <!-- Cấu hình đợt quà -->
    <div class="card bg-dark border-secondary p-2 mb-2">
      <div class="row g-2 align-items-center">
        <div class="col-7">
          <select id="campaignSelect" class="form-select form-select-sm bg-secondary text-white border-0">
            <option value="">Đang nạp đợt quà...</option>
          </select>
        </div>
        <div class="col-5">
          <input type="text" id="officerName" class="form-control form-control-sm bg-secondary text-white border-0" value="Điện thoại 1">
        </div>
      </div>
    </div>

    <!-- Màn hình quét đúng tỷ lệ CCCD (1.586 : 1) -->
    <div class="cccd-frame-wrapper mb-2">
      <div id="reader"></div>
      <div class="card-border-overlay">
        <div class="qr-target-box"></div>
      </div>
    </div>

    <!-- Nút điều khiển -->
    <div class="d-grid gap-2 mb-2">
      <button id="btnCamera" class="btn btn-primary btn-action shadow" onclick="toggleCamera()">
        📹 BẬT CAMERA QUÉT
      </button>

      <!-- Nút kích hoạt chụp quét chủ động nếu máy không tự bắt -->
      <button id="btnManualCapture" class="btn btn-outline-info btn-sm py-2 fw-bold" style="display: none;" onclick="forceScanNow()">
        ⚡ BẤM ĐỂ QUÉT NGAY LẬP TỨC
      </button>
    </div>

    <div id="scanFeedback" class="text-center text-secondary small mb-2">
      Đặt thẻ vừa vặn trong khung viền xanh, mã QR vào ô vuông vàng
    </div>

    <!-- Hộp hiển thị kết quả kiểm tra tức thì -->
    <div id="resultBox" style="display: none;" class="card p-3 text-center border-0 shadow status-card mb-3">
      <div id="resBadge" class="mb-2"></div>
      <h3 id="resName" class="fw-bold mb-1">--</h3>
      <div id="resDetail" class="small mb-3">--</div>
      <button class="btn btn-light fw-bold py-2 w-100 shadow-sm" onclick="resumeScanner()">
        ⏩ Quét tiếp người sau
      </button>
    </div>
  </div>

  <script>
    // DÁN ĐÚNG ĐƯỜNG LINK APPS SCRIPT CỦA BẠN VÀO ĐÂY:
    const API_URL = "https://script.google.com/macros/s/AKfycbyi8Jg4o7M73O8Vv8nU3c0qC67rR5xWv6V1C1Z_ePjI6Y3Fk0Y/exec";

    let html5QrScanner = null;
    let isRunning = false;
    let isBusy = false;

    window.onload = () => {
      loadCampaigns();
    };

    function loadCampaigns() {
      fetch(API_URL)
        .then(r => r.json())
        .then(res => {
          const sel = document.getElementById("campaignSelect");
          sel.innerHTML = "";
          if (res.campaigns && res.campaigns.length > 0) {
            res.campaigns.forEach(c => {
              const opt = document.createElement("option");
              opt.value = c.id;
              opt.textContent = c.id + " - " + c.name;
              sel.appendChild(opt);
            });
          } else {
            sel.innerHTML = '<option value="">Không có đợt quà đang mở</option>';
          }
        })
        .catch(err => {
          console.warn("Không tải được danh sách đợt quà: ", err);
        });
    }

    function toggleCamera() {
      const btn = document.getElementById("btnCamera");
      const btnManual = document.getElementById("btnManualCapture");

      if (isRunning) {
        stopCamera();
        btn.textContent = "📹 BẬT CAMERA QUÉT";
        btn.className = "btn btn-primary btn-action shadow";
        btnManual.style.display = "none";
        return;
      }

      if (!html5QrScanner) {
        html5QrScanner = new Html5Qrcode("reader");
      }

      // Thiết lập thông số chuẩn: Full HD 1920x1080, tỷ lệ 1.586 : 1
      const config = {
        fps: 25, // Tần số 25 khung hình/giây giúp bắt cực nhạy
        aspectRatio: 1.5858,
        videoConstraints: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920, min: 1024 },
          height: { ideal: 1080, min: 646 }
        },
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true // Tận dụng nhân phần cứng NPU của iPhone/Android
        }
      };

      html5QrScanner.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      ).then(() => {
        isRunning = true;
        btn.textContent = "⏹ TẮT CAMERA";
        btn.className = "btn btn-danger btn-action shadow";
        btnManual.style.display = "block";
        document.getElementById("scanFeedback").textContent = "Camera đang hoạt động: Đưa góc QR vào ô vuông vàng";
      }).catch(err => {
        alert("Lỗi camera: " + err);
      });
    }

    function stopCamera() {
      if (html5QrScanner && isRunning) {
        html5QrScanner.stop().then(() => {
          isRunning = false;
        });
      }
    }

    // Nhận diện mã thành công
    function onScanSuccess(decodedText) {
      if (isBusy) return;
      isBusy = true;

      const campaignId = document.getElementById("campaignSelect").value;
      const officer = document.getElementById("officerName").value;

      if (!campaignId) {
        alert("Vui lòng chọn đợt phát quà trước!");
        isBusy = false;
        return;
      }

      // Rung phản hồi báo nhận diện
      if (navigator.vibrate) navigator.vibrate(100);

      showWaitingBox();

      // Gửi dữ liệu về Google Apps Script
      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // Dùng text/plain để tránh lỗi CORS Preflight
        body: JSON.stringify({
          qrRaw: decodedText,
          campaignId: campaignId,
          officer: officer
        })
      })
      .then(res => res.json())
      .then(data => {
        renderResult(data);
      })
      .catch(err => {
        showErrorBox("Lỗi gửi dữ liệu lên Google Sheets: " + err);
      });
    }

    // Nút cưỡng bức quét dành cho trường hợp máy chậm
    function forceScanNow() {
      // Đổi lại điểm lấy nét
      document.getElementById("scanFeedback").textContent = "Đang rà quét lại toàn bộ khung hình...";
      setTimeout(() => {
        document.getElementById("scanFeedback").textContent = "Đặt thẻ vừa vặn trong khung viền xanh";
      }, 1500);
    }

    function showWaitingBox() {
      const b = document.getElementById("resultBox");
      b.style.display = "block";
      b.className = "card p-3 text-center border-0 bg-secondary text-white status-card mb-3";
      document.getElementById("resBadge").innerHTML = `<span class="badge bg-light text-dark fs-6">⏳ ĐANG ĐỐI SOÁT DỮ LIỆU...</span>`;
      document.getElementById("resName").textContent = "Đang kiểm tra";
      document.getElementById("resDetail").textContent = "Vui lòng chờ trong giây lát...";
    }

    function showErrorBox(msg) {
      const b = document.getElementById("resultBox");
      b.style.display = "block";
      b.className = "card p-3 text-center border-0 bg-dark text-white status-card mb-3";
      document.getElementById("resBadge").innerHTML = `<span class="badge bg-warning text-dark fs-6">LỖI XỬ LÝ</span>`;
      document.getElementById("resName").textContent = "Thông báo";
      document.getElementById("resDetail").textContent = msg;
    }

    function renderResult(res) {
      const b = document.getElementById("resultBox");
      b.style.display = "block";

      if (res.status === 'SUCCESS') {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        b.className = "card p-3 text-center border-0 bg-success text-white status-card mb-3";
        document.getElementById("resBadge").innerHTML = `<span class="badge bg-light text-success fs-6">✅ HỢP LỆ - ĐÃ NHẬN QUÀ</span>`;
        document.getElementById("resName").textContent = res.resident.hoTen;
        document.getElementById("resDetail").innerHTML = `
          CCCD: <strong>${res.resident.soCCCD}</strong><br>
          Khu phố: <strong>${res.resident.khuPho}</strong> (${res.resident.dienHo})<br>
          <small class="text-white-50">Thời gian nhận: ${res.time}</small>
        `;
      } else if (res.status === 'ALREADY_CLAIMED') {
        if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
        b.className = "card p-3 text-center border-0 bg-danger text-white status-card mb-3";
        document.getElementById("resBadge").innerHTML = `<span class="badge bg-warning text-dark fs-6">⚠️ ĐÃ NHẬN QUÀ RỒI!</span>`;
        document.getElementById("resName").textContent = res.resident.hoTen;
        document.getElementById("resDetail").innerHTML = `
          <strong class="text-warning">${res.message}</strong><br>
          CCCD: ${res.resident.soCCCD} | Khu phố: ${res.resident.khuPho}
        `;
      } else if (res.status === 'NOT_FOUND') {
        b.className = "card p-3 text-center border-0 bg-warning text-dark status-card mb-3";
        document.getElementById("resBadge").innerHTML = `<span class="badge bg-danger text-white fs-6">❌ NGOÀI DANH SÁCH</span>`;
        document.getElementById("resName").textContent = res.hoTen || "Không rõ danh tính";
        document.getElementById("resDetail").innerHTML = `
          CCCD: <strong>${res.cccd || "--"}</strong><br>
          <em>${res.message}</em>
        `;
      } else {
        showErrorBox(res.message);
      }
    }

    function resumeScanner() {
      document.getElementById("resultBox").style.display = "none";
      isBusy = false;
    }
  </script>
</body>
</html>
