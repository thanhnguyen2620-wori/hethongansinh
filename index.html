<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quét CCCD Thông Minh - AI Studio Vision</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #030712;
      color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    .top-header {
      background: #111827;
      padding: 12px 16px;
      text-align: center;
      border-bottom: 1px solid #1f2937;
    }
    /* Khung ngắm tỷ lệ chuẩn thẻ CCCD 1.586 : 1 */
    .viewport-box {
      position: relative;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      aspect-ratio: 1.5858 / 1;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #2563eb;
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
    }
    #cameraView {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Viền định vị thẻ */
    .card-border {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 92%;
      height: 90%;
      border: 2px dashed #38bdf8;
      border-radius: 10px;
      pointer-events: none;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.45);
      z-index: 5;
    }
    .qr-corner {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 65px;
      height: 65px;
      border: 2px solid #f59e0b;
      border-radius: 8px;
      background: rgba(245, 158, 11, 0.2);
    }
    .qr-corner::after {
      content: "MÃ QR";
      position: absolute;
      bottom: -15px;
      right: 0;
      font-size: 9px;
      font-weight: bold;
      color: #f59e0b;
    }
    .btn-action {
      font-size: 16px;
      font-weight: bold;
      padding: 14px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="fw-bold text-info fs-5">QUÉT CCCD BẰNG GEMINI AI</div>
    <small class="text-secondary">Đọc đồng thời Mã QR & Chữ số in trên thẻ</small>
  </div>

  <div class="container py-2" style="max-width: 480px;">
    <!-- Cấu hình đợt quà -->
    <div class="card bg-dark border-secondary p-2 mb-2">
      <div class="row g-2 align-items-center">
        <div class="col-7">
          <select id="campaignSelect" class="form-select form-select-sm bg-secondary text-white border-0">
            <option value="">Đang tải đợt quà...</option>
          </select>
        </div>
        <div class="col-5">
          <input type="text" id="officerName" class="form-control form-control-sm bg-secondary text-white border-0" value="ĐT 1">
        </div>
      </div>
    </div>

    <!-- Màn hình Camera 1.586 : 1 -->
    <div class="viewport-box mb-2">
      <video id="cameraView" playsinline autoplay muted></video>
      <div class="card-border">
        <div class="qr-corner"></div>
      </div>
      <canvas id="captureCanvas" style="display: none;"></canvas>
    </div>

    <!-- Nút bấm quét chụp -->
    <div class="d-grid gap-2 mb-2">
      <button id="btnScanAI" class="btn btn-primary btn-action shadow" onclick="triggerAIScan()">
        ⚡ BẤM ĐỂ AI QUÉT CCCD NGAY
      </button>
      <div class="form-check form-switch text-center d-flex justify-content-center gap-2 mt-1">
        <input class="form-check-input" type="checkbox" id="autoScanSwitch" onchange="toggleAutoScan()">
        <label class="form-check-label small text-secondary" for="autoScanSwitch">Tự động chụp quét liên tục (mỗi 2.5s)</label>
      </div>
    </div>

    <!-- Kết quả đối soát -->
    <div id="resultBox" style="display: none;" class="card p-3 text-center border-0 shadow mb-3">
      <div id="resBadge" class="mb-2"></div>
      <h3 id="resName" class="fw-bold mb-1">--</h3>
      <div id="resDetail" class="small mb-3">--</div>
      <button class="btn btn-light fw-bold py-2 w-100 shadow-sm" onclick="resumeScanner()">
        ⏩ Quét tiếp người sau
      </button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. CẤU HÌNH LIÊN KẾT (THAY 2 THÔNG SỐ CỦA BẠN VÀO ĐÂY)
    // -------------------------------------------------------------
    const GEMINI_API_KEY = "DÁN_API_KEY_GOOGLE_AI_STUDIO_VAO_DAY";
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyi8Jg4o7M73O8Vv8nU3c0qC67rR5xWv6V1C1Z_ePjI6Y3Fk0Y/exec"; // Link Web App của bạn

    const video = document.getElementById("cameraView");
    const canvas = document.getElementById("captureCanvas");
    let isProcessing = false;
    let autoScanInterval = null;

    window.addEventListener("DOMContentLoaded", () => {
      loadCampaigns();
      startCamera();
    });

    // Tải đợt quà qua JSONP tránh lỗi CORS
    function loadCampaigns() {
      const script = document.createElement("script");
      const cb = "cb_camp_" + Math.floor(Math.random() * 100000);
      window[cb] = function(res) {
        delete window[cb];
        document.body.removeChild(script);
        const sel = document.getElementById("campaignSelect");
        sel.innerHTML = "";
        if (res.campaigns && res.campaigns.length > 0) {
          res.campaigns.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c.id;
            opt.textContent = c.id + " - " + c.name;
            sel.appendChild(opt);
          });
        } else {
          sel.innerHTML = '<option value="">Không có đợt quà mở</option>';
        }
      };
      script.src = `${APPS_SCRIPT_URL}?callback=${cb}`;
      document.body.appendChild(script);
    }

    // Mở Camera trực tiếp Full HD
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920, min: 1280 },
            height: { ideal: 1080, min: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        alert("Vui lòng cấp quyền Camera trên trình duyệt!");
      }
    }

    // Bật/Tắt chế độ tự động quét mỗi 2.5 giây
    function toggleAutoScan() {
      const isChecked = document.getElementById("autoScanSwitch").checked;
      if (isChecked) {
        autoScanInterval = setInterval(() => {
          if (!isProcessing) triggerAIScan();
        }, 2500);
      } else {
        clearInterval(autoScanInterval);
      }
    }

    // Chụp khung hình và gửi đến Gemini Vision
    async function triggerAIScan() {
      if (isProcessing) return;
      
      const campaignId = document.getElementById("campaignSelect").value;
      if (!campaignId) {
        alert("Vui lòng chọn đợt phát quà trước!");
        return;
      }

      isProcessing = true;
      showStatus("⏳ GEMINI AI ĐANG ĐỌC THẺ...", "Trí tuệ nhân tạo đang bóc tách số CCCD & mã QR...");

      // Chụp ảnh từ luồng video
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // Lấy dữ liệu ảnh dạng Base64
      const base64Image = canvas.toDataURL("image/jpeg", 0.85).split(',')[1];

      try {
        // Gửi trực tiếp đến Gemini 2.5 Flash API
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                {
                  text: "Đây là hình ảnh thẻ Căn cước công dân (CCCD) Việt Nam. Hãy đọc mã QR ở góc trên bên phải hoặc đọc dòng Số/No. trên mặt thẻ. Trả về định dạng JSON duy nhất: {\"cccd\": \"12 chữ số\", \"hoTen\": \"Họ và tên nếu có\"}. Không giải thích gì thêm."
                },
                {
                  inline_data: {
                    mime_type: "image/jpeg",
                    data: base64Image
                  }
                }
              ]
            }],
            generationConfig: {
              response_mime_type: "application/json"
            }
          })
        });

        const data = await response.json();
        const rawJsonText = data.candidates[0].content.parts[0].text;
        const parsed = JSON.parse(rawJsonText);

        if (parsed && parsed.cccd && parsed.cccd.replace(/\D/g, '').length === 12) {
          const cleanCCCD = parsed.cccd.replace(/\D/g, '');
          sendToGoogleSheets(cleanCCCD, parsed.hoTen || "");
        } else {
          showError("AI chưa thấy rõ thẻ CCCD. Vui lòng đặt thẻ thẳng góc và bấm quét lại!");
          isProcessing = false;
        }

      } catch (err) {
        showError("Lỗi phân tích AI: " + err.message);
        isProcessing = false;
      }
    }

    // Gửi số CCCD đã bóc tách về Google Sheets đối soát
    function sendToGoogleSheets(cccd, hoTen) {
      showStatus("⏳ ĐANG ĐỐI SOÁT GOOGLE SHEETS...", `Số CCCD: ${cccd}`);
      
      const campaignId = document.getElementById("campaignSelect").value;
      const officer = document.getElementById("officerName").value;

      const script = document.createElement("script");
      const cb = "cb_checkin_" + Math.floor(Math.random() * 100000);

      window[cb] = function(res) {
        delete window[cb];
        document.body.removeChild(script);
        renderResult(res);
      };

      const params = new URLSearchParams({
        action: "scan",
        cccd: cccd,
        hoTenAI: hoTen,
        campaignId: campaignId,
        officer: officer,
        callback: cb
      });

      script.src = `${APPS_SCRIPT_URL}?${params.toString()}`;
      document.body.appendChild(script);
    }

    function showStatus(title, sub) {
      const b = document.getElementById("resultBox");
      b.style.display = "block";
      b.className = "card p-3 text-center border-0 bg-secondary text-white mb-3";
      document.getElementById("resBadge").innerHTML = `<span class="badge bg-light text-dark fs-6">${title}</span>`;
      document.getElementById("resName").textContent = "Đang xử lý";
      document.getElementById("resDetail").textContent = sub;
    }

    function showError(msg) {
      const b = document.getElementById("resultBox");
      b.style.display = "block";
      b.className = "card p-3 text-center border-0 bg-dark text-white mb-3";
      document.getElementById("resBadge").innerHTML = `<span class="badge bg-warning text-dark fs-6">CHƯA NHẬN DIỆN ĐƯỢC</span>`;
      document.getElementById("resName").textContent = "Thử lại";
      document.getElementById("resDetail").textContent = msg;
    }

    function renderResult(res) {
      const b = document.getElementById("resultBox");
      b.style.display = "block";

      if (res.status === 'SUCCESS') {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        b.className = "card p-3 text-center border-0 bg-success text-white mb-3";
        document.getElementById("resBadge").innerHTML = `<span class="badge bg-light text-success fs-6">✅ HỢP LỆ - ĐÃ PHÁT QUÀ</span>`;
        document.getElementById("resName").textContent = res.resident.hoTen;
        document.getElementById("resDetail").innerHTML = `
          CCCD: <strong>${res.resident.soCCCD}</strong><br>
          Khu phố: <strong>${res.resident.khuPho}</strong> (${res.resident.dienHo})<br>
          <small class="text-white-50">Thời gian nhận: ${res.time}</small>
        `;
      } else if (res.status === 'ALREADY_CLAIMED') {
        if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
        b.className = "card p-3 text-center border-0 bg-danger text-white mb-3";
        document.getElementById("resBadge").innerHTML = `<span class="badge bg-warning text-dark fs-6">⚠️ ĐÃ NHẬN QUÀ RỒI!</span>`;
        document.getElementById("resName").textContent = res.resident.hoTen;
        document.getElementById("resDetail").innerHTML = `
          <strong class="text-warning">${res.message}</strong><br>
          CCCD: ${res.resident.soCCCD} | Khu phố: ${res.resident.khuPho}
        `;
      } else if (res.status === 'NOT_FOUND') {
        b.className = "card p-3 text-center border-0 bg-warning text-dark mb-3";
        document.getElementById("resBadge").innerHTML = `<span class="badge bg-danger text-white fs-6">❌ NGOÀI DANH SÁCH</span>`;
        document.getElementById("resName").textContent = res.hoTen || "Không rõ danh tính";
        document.getElementById("resDetail").innerHTML = `
          CCCD: <strong>${res.cccd || "--"}</strong><br>
          <em>${res.message}</em>
        `;
      } else {
        showError(res.message);
      }
    }

    function resumeScanner() {
      document.getElementById("resultBox").style.display = "none";
      isProcessing = false;
    }
  </script>
</body>
</html>
