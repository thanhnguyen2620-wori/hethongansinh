<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quét CCCD Nhận Quà</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Thư viện quét mã chuyên dụng -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      background-color: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    .top-header {
      background: #1e293b;
      padding: 12px 16px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }
    /* Khung quét tỉ lệ chuẩn CCCD 16:9 */
    .viewport-container {
      position: relative;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      aspect-ratio: 16 / 9; /* Tỉ lệ chuẩn nằm ngang thẻ CCCD */
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #334155;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    #reader {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }
    #reader video {
      object-fit: cover !important;
      width: 100% !important;
      height: 100% !important;
    }
    /* Khung ngắm mô phỏng thẻ CCCD */
    .card-frame-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 88%;
      height: 82%;
      border: 2.5px solid #38bdf8;
      border-radius: 12px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
      z-index: 5;
    }
    /* Góc nhận diện mã QR phía trên bên phải */
    .qr-target-corner {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 65px;
      height: 65px;
      border: 2px dashed #f59e0b;
      border-radius: 8px;
      background: rgba(245, 158, 11, 0.15);
    }
    .qr-target-corner::after {
      content: "QR CCCD";
      position: absolute;
      bottom: -18px;
      right: 0;
      font-size: 9px;
      color: #f59e0b;
      font-weight: bold;
    }
    .btn-action {
      font-size: 16px;
      font-weight: bold;
      padding: 14px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="fw-bold text-info fs-5">🎁 ĐIỂM DANH TRAO QUÀ CCCD</div>
    <small class="text-secondary">Khung ngắm chuẩn 16:9 bao trọn thẻ</small>
  </div>

  <div class="container py-2" style="max-width: 480px;">
    <!-- Cấu hình đợt quà -->
    <div class="card bg-dark border-secondary p-2 mb-2">
      <div class="row g-2 align-items-center">
        <div class="col-7">
          <select id="campaignSelect" class="form-select form-select-sm bg-secondary text-white border-0">
            <option value="">Đang tải đợt quà...</option>
          </select>
        </div>
        <div class="col-5">
          <input type="text" id="officerName" class="form-control form-control-sm bg-secondary text-white border-0" value="Điện thoại 1">
        </div>
      </div>
    </div>

    <!-- Màn hình Camera 16:9 -->
    <div class="viewport-container mb-2">
      <div id="reader"></div>
      <div class="card-frame-overlay">
        <div class="qr-target-corner"></div>
      </div>
    </div>

    <!-- Các nút điều khiển quét trực tiếp -->
    <div class="d-grid gap-2 mb-2">
      <button id="btnScanAction" class="btn btn-primary btn-action shadow" onclick="toggleCameraStream()">
        📹 BẬT CAMERA QUÉT
      </button>
      <div class="d-flex justify-content-between px-1">
        <span class="small text-secondary">Hướng mã QR vào góc vàng</span>
        <button id="btnTorch" class="btn btn-outline-warning btn-sm py-1 px-3" style="display: none;" onclick="toggleTorch()">
          🔦 Bật đèn Flash
        </button>
      </div>
    </div>

    <!-- Kết quả trả về sau khi quét -->
    <div id="resultBox" style="display: none;" class="card p-3 text-center border-0 shadow mb-3">
      <div id="resBadge" class="mb-2"></div>
      <h3 id="resName" class="fw-bold mb-1">--</h3>
      <div id="resDetail" class="small mb-3">--</div>
      <button class="btn btn-light fw-bold py-2 w-100 shadow-sm" onclick="resumeScanner()">
        ⏩ Quét tiếp người sau
      </button>
    </div>
  </div>

  <script>
    // DÁN ĐÚNG LINK APPS SCRIPT ĐÃ TRIỂN KHAI CỦA BẠN VÀO ĐÂY:
    const API_URL = "https://script.google.com/macros/s/AKfycbyWQHXubH4wjJZhCV3pFBK10Vhoje17EvsvCsV1s45vF0abZUvgaXXWN1XsVRn5Tz3d/exec"; // Thay đúng link của bạn nếu đổi mới

    let scanner = null;
    let isScanning = false;
    let isLocked = false;
    let isTorchOn = false;

    window.onload = () => {
      loadCampaigns();
    };

    function loadCampaigns() {
      fetch(API_URL)
        .then(r => r.json())
        .then(res => {
          const sel = document.getElementById("campaignSelect");
          sel.innerHTML = "";
          if (res.campaigns && res.campaigns.length > 0) {
            res.campaigns.forEach(c => {
              const opt = document.createElement("option");
              opt.value = c.id;
              opt.textContent = c.id + " - " + c.name;
              sel.appendChild(opt);
            });
          } else {
            sel.innerHTML = '<option value="">Không có đợt quà mở</option>';
          }
        })
        .catch(e => console.warn("Lỗi tải đợt quà: ", e));
    }

    // Bật/Tắt Camera quét
    function toggleCameraStream() {
      const btn = document.getElementById("btnScanAction");

      if (isScanning) {
        stopScanner();
        btn.textContent = "📹 BẬT CAMERA QUÉT";
        btn.className = "btn btn-primary btn-action shadow";
        document.getElementById("btnTorch").style.display = "none";
        return;
      }

      if (!scanner) {
        scanner = new Html5Qrcode("reader");
      }

      // Cấu hình quét toàn màn hình camera để không bỏ sót góc QR
      const scanConfig = {
        fps: 20, // Tần số 20 hình/giây giúp bắt cực nhạy
        aspectRatio: 16 / 9,
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true // Kích hoạt bộ giải mã phần cứng siêu tốc của điện thoại
        }
      };

      scanner.start(
        { facingMode: "environment" },
        scanConfig,
        onCodeScanned
      ).then(() => {
        isScanning = true;
        btn.textContent = "⏹ DỪNG CAMERA";
        btn.className = "btn btn-danger btn-action shadow";
        
        // Kiểm tra xem điện thoại có hỗ trợ đèn pin/flash không
        try {
          const capabilities = scanner.getRunningTrackCapabilities();
          if (capabilities.torch) {
            document.getElementById("btnTorch").style.display = "inline-block";
          }
        } catch (e) {}
      }).catch(err => {
        alert("Không thể khởi động camera: " + err);
      });
    }

    function stopScanner() {
      if (scanner && isScanning) {
        scanner.stop().then(() => {
          isScanning = false;
        });
      }
    }

    function toggleTorch() {
      if (!scanner || !isScanning) return;
      isTorchOn = !isTorchOn;
      scanner.applyVideoConstraints({
        advanced: [{ torch: isTorchOn }]
      });
      document.getElementById("btnTorch").textContent = isTorchOn ? "💡 Tắt Đèn Flash" : "🔦 Bật Đèn Flash";
    }

    // Khi camera nhận diện được mã QR
    function onCodeScanned(qrDecodedText) {
      if (isLocked) return;
      isLocked = true;

      const campaignId = document.getElementById("campaignSelect").value;
      const officer = document.getElementById("officerName").value;

      if (!campaignId) {
        alert("Vui lòng chọn đợt phát quà trước!");
        isLocked = false;
        return;
      }

      // Rung điện thoại báo nhận diện
      if (navigator.vibrate) navigator.vibrate(100);

      showWaitBox();

      // Gửi về Google Sheets đối soát
      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          qrRaw: qrDecodedText,
          campaignId: campaignId,
          officer: officer
        })
      })
      .then(res => res.json())
      .then(result => {
        renderResult(result);
      })
      .catch(err => {
        showErrorBox("Lỗi máy chủ: " + err);
      });
    }

    function showWaitBox() {
      const b = document.getElementById("resultBox");
      b.style.display = "block";
      b.className = "card p-3 text-center border-0 bg-secondary text-white mb-3";
      document.getElementById("resBadge").innerHTML = `<span class="badge bg-light text-dark fs-6">⏳ ĐANG ĐỐI SOÁT GOOGLE SHEETS...</span>`;
      document.getElementById("resName").textContent = "Đang kiểm tra";
      document.getElementById("resDetail").textContent = "Vui lòng chờ trong giây lát...";
    }

    function showErrorBox(msg) {
      const b = document.getElementById("resultBox");
      b.style.display = "block";
      b.className = "card p-3 text-center border-0 bg-dark text-white mb-3";
      document.getElementById("resBadge").innerHTML = `<span class="badge bg-warning text-dark fs-6">LỖI XỬ LÝ</span>`;
      document.getElementById("resName").textContent = "Thông báo";
      document.getElementById("resDetail").textContent = msg;
    }

    function renderResult(res) {
      const b = document.getElementById("resultBox");
      b.style.display = "block";

      if (res.status === 'SUCCESS') {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        b.className = "card p-3 text-center border-0 bg-success text-white mb-3";
        document.getElementById("resBadge").innerHTML = `<span class="badge bg-light text-success fs-6">✅ HỢP LỆ - ĐÃ PHÁT QUÀ</span>`;
        document.getElementById("resName").textContent = res.resident.hoTen;
        document.getElementById("resDetail").innerHTML = `
          CCCD: <strong>${res.resident.soCCCD}</strong><br>
          Khu phố: <strong>${res.resident.khuPho}</strong> (${res.resident.dienHo})<br>
          <small class="text-white-50">Thời gian nhận: ${res.time}</small>
        `;
      } else if (res.status === 'ALREADY_CLAIMED') {
        if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
        b.className = "card p-3 text-center border-0 bg-danger text-white mb-3";
        document.getElementById("resBadge").innerHTML = `<span class="badge bg-warning text-dark fs-6">⚠️ ĐÃ NHẬN QUÀ RỒI!</span>`;
        document.getElementById("resName").textContent = res.resident.hoTen;
        document.getElementById("resDetail").innerHTML = `
          <strong class="text-warning">${res.message}</strong><br>
          CCCD: ${res.resident.soCCCD} | Khu phố: ${res.resident.khuPho}
        `;
      } else if (res.status === 'NOT_FOUND') {
        b.className = "card p-3 text-center border-0 bg-warning text-dark mb-3";
        document.getElementById("resBadge").innerHTML = `<span class="badge bg-danger text-white fs-6">❌ NGOÀI DANH SÁCH</span>`;
        document.getElementById("resName").textContent = "Không tìm thấy";
        document.getElementById("resDetail").innerHTML = `
          CCCD: <strong>${res.cccd || "--"}</strong><br>
          <em>Số CCCD này không thuộc danh sách duyệt!</em>
        `;
      } else {
        showErrorBox(res.message);
      }
    }

    function resumeScanner() {
      document.getElementById("resultBox").style.display = "none";
      isLocked = false;
    }
  </script>
</body>
</html>
